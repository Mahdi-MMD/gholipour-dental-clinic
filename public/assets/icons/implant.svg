      stroke-width="2.3" 
      stroke-linecap="round"
    />

    <!-- Thread 3 -->
    <path 
      d="M 41 73 L 59 73" 
      stroke="#1c2d37" 
      stroke-width="2.3" 
      stroke-linecap="round"
    />

