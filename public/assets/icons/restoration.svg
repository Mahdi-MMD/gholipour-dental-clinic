<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Scaled group for prominent, recognizable tooth restoration display -->
  <g transform="translate(50, 50) scale(0.96) translate(-50, -50)">
    
    <!-- Anatomical Molar Tooth Outline -->
    <path 
      d="M 28 43
         C 26 31 29 20 40 19
         C 45 18.5 48 21.5 50 22.5
         C 52 21.5 55 18.5 60 19
         C 71 20 74 31 72 43
         C 70 54 68 70 65 83
         C 63 88 58 88 56 83
         C 53 73 51 62 50 56
         C 49 62 47 73 44 83
         C 42 88 37 88 35 83
         C 32 70 30 54 28 43 Z" 
      stroke="#1c2d37" 
      stroke-width="2.7" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Occlusal groove contours on left side -->
    <path 
      d="M 32 28 C 36 32 40 33 44 33" 
      stroke="#1c2d37" 
      stroke-width="2.1" 
      stroke-linecap="round"
    />

    <!-- Restorative Composite Inlay / Filling Area (beveled pocket on upper crown) -->
    <path 
      d="M 42 22 
         C 46 22 52 21 58 22
         C 64 23 66 28 66 35
         C 66 42 60 46 52 46
         C 44 46 41 40 41 33
         C 41 27 42 22 42 22 Z" 
      stroke="#1c2d37" 
      stroke-width="2.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Inlay filling detail lines (stratified composite layers) -->
    <path 
      d="M 46 30 C 51 31 57 31 62 29" 
      stroke="#1c2d37" 
      stroke-width="2" 
      stroke-linecap="round" 
      stroke-dasharray="2 3"
    />
    <path 
      d="M 45 37 C 50 39 56 39 61 36" 
      stroke="#1c2d37" 
      stroke-width="2" 
      stroke-linecap="round" 
      stroke-dasharray="2 3"
    />

    <!-- Diamond Sparkle Accent on top right indicating restorative shine -->
    <path 
      d="M 80 14 
         C 80 19 82 21 86 21 
         C 82 21 80 23 80 28 
         C 80 23 78 21 74 21 
         C 78 21 80 19 80 14 Z" 
      stroke="#1c2d37" 
      stroke-width="2.2" 
      stroke-linejoin="round"
    />
    <!-- Small secondary sparkle -->
    <circle cx="87" cy="12" r="1.5" fill="#1c2d37" />
  </g>
</svg>
